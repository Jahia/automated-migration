lsp_jcrQuery.loadMore.ui.tooltip = Show a "Load more" button instead of rendering all results at once.
lsp_jcrQuery.categoryFilter = Category chips
lsp_jcrQuery.categoryFilter.ui.tooltip = Show category filter chips above the listing.

