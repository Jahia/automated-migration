# base-library — bundle de ressources français (libellés CND).
# Template GÉNÉRATEUR : $NS / $NSMIX remplacés par le préfixe projet à l'installation.
# Le séparateur de namespace `:` devient `_` dans les clés .properties (i18n.md).
# CHAQUE clé de champ possède sa clé compagnon .ui.tooltip (CLAUDE.md règle 18).

# ── Mixins de style / groupes de champs ──
$NSMIX_cta.ctaLabel = Libellé du bouton
$NSMIX_cta.ctaLabel.ui.tooltip = <b>Libellé du bouton</b> — texte affiché sur l'appel à l'action. Laissez le lien vide pour masquer le bouton.
$NSMIX_cta.j_linkType = Lien
$NSMIX_cta.j_linkType.ui.tooltip = <b>Lien</b> — choisissez une page interne ou une URL externe. Laissez vide pour ne pas afficher de lien.

