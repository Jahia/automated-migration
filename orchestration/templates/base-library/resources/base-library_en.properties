# base-library — English resource bundle (CND labels).
# GENERATOR template: $NS / $NSMIX stamped to the project prefix at install time.
# The `:` namespace separator becomes `_` in .properties keys (i18n.md).
# EVERY field key ships a companion .ui.tooltip (CLAUDE.md rule 18 / i18n.md).

# ── Style / field-group mixins ──
$NSMIX_cta.ctaLabel = Button label
$NSMIX_cta.ctaLabel.ui.tooltip = <b>Button label</b> — text shown on the call-to-action. Leave the link empty to hide the button.
$NSMIX_cta.j_linkType = Link
$NSMIX_cta.j_linkType.ui.tooltip = <b>Link</b> — choose an internal page or an external URL. Leave empty for no link.

$NSMIX_media.image = Image
$NSMIX_media.image.ui.tooltip = <b>Image</b> — pick an image from the Digital Asset Manager (DAM).
$NSMIX_media.imageAltText = Alt text
$NSMIX_media.imageAltText.ui.tooltip = <b>Alt text</b> — alternative text describing the image (required for accessibility).

$NSMIX_theme.theme = Theme
$NSMIX_theme.theme.ui.tooltip = <b>Theme</b> — colour variant applied to this component.
$NSMIX_theme.theme.light = Light
$NSMIX_theme.theme.dark = Dark
$NSMIX_theme.theme.brand = Brand

$NSMIX_background.bgColor = Background
$NSMIX_background.bgColor.ui.tooltip = <b>Background</b> — background colour of the section.
$NSMIX_background.bgColor.bg-default = Default
$NSMIX_background.bgColor.bg-white = White
$NSMIX_background.bgColor.bg-grey = Grey
$NSMIX_background.bgColor.bg-brand = Brand

$NSMIX_spacing.spacing = Spacing
$NSMIX_spacing.spacing.ui.tooltip = <b>Spacing</b> — vertical padding above and below the section.
$NSMIX_spacing.spacing.none = None
$NSMIX_spacing.spacing.sm = Small
$NSMIX_spacing.spacing.md = Medium
$NSMIX_spacing.spacing.lg = Large

$NSMIX_cornerCut.cornerCut = Corner cut
$NSMIX_cornerCut.cornerCut.ui.tooltip = <b>Corner cut</b> — decorative diagonal cut on one corner.
$NSMIX_cornerCut.cornerCut.none = None
$NSMIX_cornerCut.cornerCut.cut-topleft = Top-left
$NSMIX_cornerCut.cornerCut.cut-botright = Bottom-right

$NSMIX_badge.badgeLabel = Badge label
$NSMIX_badge.badgeLabel.ui.tooltip = <b>Badge label</b> — short text shown inside the tag/badge chip.
$NSMIX_badge.badgeStyle = Badge style
$NSMIX_badge.badgeStyle.ui.tooltip = <b>Badge style</b> — colour variant of the badge.
$NSMIX_badge.badgeStyle.default = Default
$NSMIX_badge.badgeStyle.info = Info
$NSMIX_badge.badgeStyle.success = Success
$NSMIX_badge.badgeStyle.warning = Warning

$NSMIX_seo.metaTitle = Meta title
$NSMIX_seo.metaTitle.ui.tooltip = <b>Meta title</b> — title used by search engines and social shares.
$NSMIX_seo.metaDescription = Meta description
$NSMIX_seo.metaDescription.ui.tooltip = <b>Meta description</b> — summary used by search engines and social shares.

