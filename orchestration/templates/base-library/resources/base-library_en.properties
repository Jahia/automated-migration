# ── JCR Query (the editor listing tool) ──
$NS_jcrQuery = JCR Query
$NS_jcrQuery.ui.tooltip = Listing component — automatically queries and renders content by type as cards.
$NS_jcrQuery.type = Content type
$NS_jcrQuery.type.ui.tooltip = <b>Content type</b> — which content to list.
$NS_jcrQuery.type.jnt\:page = Pages
$NS_jcrQuery.criteria = Sort by
$NS_jcrQuery.criteria.ui.tooltip = <b>Sort by</b> — property used to order the results.
$NS_jcrQuery.criteria.jcr\:created = Creation date
$NS_jcrQuery.criteria.jcr\:lastModified = Last modified date
$NS_jcrQuery.criteria.j\:lastPublished = Last published date
$NS_jcrQuery.sortDirection = Sort order
$NS_jcrQuery.sortDirection.ui.tooltip = <b>Sort order</b> — ascending (oldest first) or descending (newest first).
$NS_jcrQuery.sortDirection.asc = Ascending
$NS_jcrQuery.sortDirection.desc = Descending
$NS_jcrQuery.maxItems = Maximum items
$NS_jcrQuery.maxItems.ui.tooltip = <b>Maximum items</b> — leave empty to show all results.
$NS_jcrQuery.startNode = Scope
$NS_jcrQuery.startNode.ui.tooltip = <b>Scope</b> — optional: limit results to descendants of this node.
$NS_jcrQuery.excludeNodes = Exclude nodes
$NS_jcrQuery.excludeNodes.ui.tooltip = <b>Exclude nodes</b> — optional: remove specific nodes from the results.
$NS_jcrQuery.filter = Category filter
$NS_jcrQuery.filter.ui.tooltip = <b>Category filter</b> — optional: only show items tagged with these categories.
$NS_jcrQuery.noResultText = No-results message
$NS_jcrQuery.noResultText.ui.tooltip = <b>No-results message</b> — text shown when no items match the query.
$NS_jcrQuery.j\:subNodesView = Card view
$NS_jcrQuery.j\:subNodesView.ui.tooltip = <b>Card view</b> — which view to render for each result.
$NS_jcrQuery.j\:linkType = See-all link
$NS_jcrQuery.j\:linkType.ui.tooltip = <b>See-all link</b> — optional link shown at the top-right of the listing.
