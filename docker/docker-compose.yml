services:
  jahia:
    image: jahia/jahia-ee:8.2
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"
      - "9229:9229"
    environment:
      DB_VENDOR: postgresql
      DB_URL: jdbc:postgresql://postgres:5432/jahia
      DB_USER: jahia
      DB_PASS: dbpassword
      # Explicit heap (Julian, 2026-07-04, post-OOM): -Xmx beats the image's
      # MaxRAMPercentage=80, which sized the heap against the WHOLE Docker VM
      # (no container limit) and got the container SIGKILLed under DAM load.
      # Sized for a 12G Docker VM with the sec-lab containers stopped.
      CATALINA_OPTS: "-Xmx8g"
      JPDA: "true"
      EXECUTE_PROVISIONING_SCRIPT: "file:/mnt/jahia/provisioning.yml"
    volumes:
      - .:/mnt/jahia
    healthcheck:
      test: ["CMD", "curl", "http://localhost:8080/start"]
      interval: 5s
      timeout: 1s
      retries: 30

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: jahia
      POSTGRES_PASSWORD: dbpassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "jahia"]
      interval: 5s
      timeout: 1s
      retries: 30

volumes:
  pgdata:
